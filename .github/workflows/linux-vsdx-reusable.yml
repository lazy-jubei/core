name: Reusable Linux VSDX package build

on:
  workflow_call:
    inputs:
      format:
        required: true
        type: string
      artifact_name:
        required: true
        type: string
      artifact_path:
        required: true
        type: string
      packaging_tools:
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build-linux-package:
    name: Build ${{ inputs.format }}
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache

    steps:
      - name: Check out the VSDX branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false

      - name: Reclaim build space
        run: |
          set -euxo pipefail
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h /

      - name: Install Linux build prerequisites
        env:
          PACKAGING_TOOLS: ${{ inputs.packaging_tools }}
        run: |
          set -euxo pipefail
          sudo sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update
          sudo apt-get build-dep -y libreoffice
          read -r -a packaging_tools <<< "$PACKAGING_TOOLS"
          sudo apt-get install -y ccache fakeroot file pax-utils "${packaging_tools[@]}"
          sudo apt-get clean

      - name: Cache external sources
        uses: actions/cache@v5
        with:
          path: .cache/lo-externaltar
          key: libreoffice-externals-${{ inputs.format }}-${{ hashFiles('download.lst') }}

      - name: Cache compiler outputs
        uses: actions/cache@v5
        with:
          path: .ccache
          key: libreoffice-vsdx-linux-${{ inputs.format }}-ccache-${{ github.sha }}
          restore-keys: |
            libreoffice-vsdx-linux-${{ inputs.format }}-ccache-

      - name: Configure LibreOfficeDev Linux build
        run: |
          set -euxo pipefail
          mkdir -p .cache/lo-externaltar
          ccache --max-size=2G
          ./autogen.sh \
            --disable-debug \
            --without-java \
            --without-doxygen \
            --with-lang=en-US \
            --disable-online-update \
            --enable-epm \
            --with-epm=internal \
            --with-package-format=deb \
            --with-external-tar="$PWD/.cache/lo-externaltar" \
            2>&1 | tee 'autogen-${{ inputs.format }}.log'

      - name: Fetch external sources
        run: |
          set -euxo pipefail
          make fetch 2>&1 | tee 'fetch-${{ inputs.format }}.log'

      - name: Build LibreOfficeDev
        run: |
          set -o pipefail
          make -j"$(nproc)" 2>&1 | tee 'build-${{ inputs.format }}.log'

      - name: Save compiler cache after a failed build
        if: failure()
        uses: actions/cache/save@v5
        with:
          path: .ccache
          key: libreoffice-vsdx-linux-${{ inputs.format }}-ccache-${{ github.sha }}

      - name: Run VSDX export tests
        run: |
          set -o pipefail
          make -j"$(nproc)" CppunitTest_sd_visio_export_tests \
            2>&1 | tee 'visio-tests-${{ inputs.format }}.log'

      - name: Verify the Linux program
        run: |
          set -euxo pipefail
          instdir/program/soffice --headless --version

      - name: Collect Debian packages
        run: |
          set -euxo pipefail
          mkdir -p artifacts/deb artifacts/deb-extracted
          find workdir/installation -type f -name '*.deb' -exec cp -f '{}' artifacts/deb/ \;
          if ! find artifacts/deb -maxdepth 1 -type f -name '*.deb' -print -quit | grep -q .; then
            while IFS= read -r archive; do
              tar -xzf "$archive" -C artifacts/deb-extracted
            done < <(find workdir/installation -type f -name '*_deb.tar.gz')
            find artifacts/deb-extracted -type f -name '*.deb' -exec cp -f '{}' artifacts/deb/ \;
          fi
          if ! find artifacts/deb -maxdepth 1 -type f -name '*.deb' -print -quit | grep -q .; then
            echo 'The build completed without producing Debian packages.' >&2
            find workdir/installation -maxdepth 8 -type f -print || true
            exit 1
          fi
          cp README.md artifacts/deb/README-VSDX-FORK.md
          find artifacts/deb -maxdepth 1 -type f -name '*.deb' -print0 | sort -z | xargs -0 -n1 dpkg-deb --info
          sha256sum artifacts/deb/*.deb

      - name: Build ${{ inputs.format }} bundle
        if: inputs.format != 'deb'
        run: |
          set -o pipefail
          bash .github/scripts/package-linux-bundles.sh \
            artifacts/deb \
            artifacts/bundles \
            workdir/linux-bundles \
            '${{ inputs.format }}' \
            2>&1 | tee 'linux-bundle-${{ inputs.format }}.log'

      - name: Upload ${{ inputs.format }} package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ inputs.artifact_path }}
          retention-days: 14
          compression-level: 0
          if-no-files-found: error

      - name: Upload ${{ inputs.format }} diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: linux-${{ inputs.format }}-build-logs
          path: |
            autogen-${{ inputs.format }}.log
            fetch-${{ inputs.format }}.log
            build-${{ inputs.format }}.log
            visio-tests-${{ inputs.format }}.log
            linux-bundle-${{ inputs.format }}.log
            config.log
            workdir/CppunitTest/sd_visio_export_tests.test.log
            workdir/CustomTarget/instsetoo_native/install/*.log
            workdir/linux-bundles/dependencies.txt
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 6
