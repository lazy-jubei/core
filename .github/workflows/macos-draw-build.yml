name: macOS Draw and VSDX build

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Source commit to build (blank uses the selected branch)
        type: string
        default: ''
      architecture:
        description: Architecture to build
        type: choice
        default: both
        options: [both, arm64, x86_64]
  push:
    branches: [libreoffice-26-8-0-extras]

permissions:
  contents: read

concurrency:
  group: macos-draw-${{ github.ref }}-${{ inputs.architecture || 'both' }}
  cancel-in-progress: true

jobs:
  build-macos:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.arch == 'arm64' && 'macos-15' || 'macos-15-intel' }}
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(inputs.architecture == 'x86_64' && '["x86_64"]' || inputs.architecture == 'arm64' && '["arm64"]' || '["arm64","x86_64"]') }}
    defaults:
      run:
        shell: bash
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      MAKE: gmake

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false

      - name: Install build prerequisites
        run: |
          set -euxo pipefail
          test "$(uname -m)" = '${{ matrix.arch }}'
          xcodebuild -version
          xcrun --show-sdk-path
          df -h .
          brew install autoconf automake libtool pkgconf nasm make cpanminus gperf
          # Prefer Homebrew's gperf over the old version supplied by Xcode.
          echo "$(brew --prefix gperf)/bin" >> "$GITHUB_PATH"
          cpanm --notest --local-lib-contained "$RUNNER_TEMP/perl5" Archive::Zip
          echo "PERL5LIB=$RUNNER_TEMP/perl5/lib/perl5" >> "$GITHUB_ENV"

      - name: Cache downloaded source archives
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/lo-externaltar
          key: macos-sources-${{ hashFiles('download.lst') }}

      - name: Configure LibreOffice
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/lo-externaltar"
          # configure recognizes Homebrew's pkg-config alias, not pkgconf.
          export PKG_CONFIG="$(brew --prefix)/bin/pkg-config"
          # Intel runs approached the hosted job limit without precompiled headers.
          extra_config=()
          if [ '${{ matrix.arch }}' = x86_64 ]; then
            # Use the system/base header level recommended by configure for Clang.
            extra_config+=(--enable-pch=base)
          fi
          ./autogen.sh \
            ${extra_config[@]+"${extra_config[@]}"} \
            --disable-debug \
            # configure appends "Dev" to the product name unless a release
            # build is requested; together these yield plain "LibreOffice".
            --with-product-name=LibreOffice \
            --enable-release-build \
            --without-java \
            --without-dotnet \
            --without-doxygen \
            --with-lang=en-US \
            --disable-online-update \
            --disable-macosx-code-signing \
            --disable-macosx-package-signing \
            --with-macosx-version-min-required=11.0 \
            --with-external-tar="$RUNNER_TEMP/lo-externaltar" \
            2>&1 | tee autogen.log

      - name: Fetch and build LibreOffice
        run: |
          set -euxo pipefail
          gmake fetch 2>&1 | tee fetch.log
          gmake -j3 build 2>&1 | tee build.log

      - name: Run drawing and VSDX regression tests
        run: |
          set -euxo pipefail
          gmake -j3 CppunitTest_svx_unit CppunitTest_sd_visio_export_tests \
            2>&1 | tee regression-tests.log

      - name: Assemble and verify the app bundle
        run: |
          set -euxo pipefail
          gmake -j3 test-install TESTINSTALLDIR="$RUNNER_TEMP/mac-install" \
            2>&1 | tee install.log
          shopt -s nullglob
          apps=("$RUNNER_TEMP/mac-install/"*.app)
          test "${#apps[@]}" -eq 1
          "${apps[0]}/Contents/MacOS/soffice" --headless --version
          mkdir -p artifacts
          archive="artifacts/LibreOffice-Draw-VSDX-macOS-${{ matrix.arch }}.zip"
          ditto -c -k --sequesterRsrc --keepParent "${apps[0]}" "$archive"
          shasum -a 256 "$archive" > "$archive.sha256"
          printf 'Development build from %s\nNot Developer ID signed or notarized.\n' "$(git rev-parse HEAD)" > artifacts/BUILD-INFO.txt

      - name: Bundle the Microsoft Aptos fonts
        run: |
          set -euxo pipefail
          aptos_dir="$RUNNER_TEMP/aptos-fonts"
          mkdir -p "$aptos_dir"
          curl --fail --location --retry 3 \
            'https://download.microsoft.com/download/8/6/0/860a94fa-7feb-44ef-ac79-c072d9113d69/Microsoft%20Aptos%20Fonts.zip' \
            --output "$aptos_dir/aptos.zip"
          unzip -o -q "$aptos_dir/aptos.zip" -d "$aptos_dir"
          test -n "$(find "$aptos_dir" -maxdepth 1 -name 'Aptos.ttf' -print -quit)"
          shopt -s nullglob
          apps=("$RUNNER_TEMP/mac-install/"*.app)
          test "${#apps[@]}" -eq 1
          app="${apps[0]}"
          # In the macOS .app bundle the LO 'share' is the bundle's
          # Resources/ dir (it holds config/, svx/, calc/, fonts/,
          # lounorc, sofficerc, ... — the classic LO share contents) and
          # 'program' is Frameworks/. There is NO literal 'program'/'share'
          # dir and NO 'soffice.bin' in the bundle (verified against the
          # official 26.8.0 bundle), so anchor directly on
          # Contents/Resources rather than hunting for a home dir.
          share_dir="$app/Contents/Resources"
          test -d "$share_dir"
          # macOS scans this directory's top-level files only, so the
          # fonts must sit flat in it.
          mkdir -p "$share_dir/fonts/truetype"
          cp -f "$aptos_dir"/*.ttf "$aptos_dir"/*.rtf "$share_dir/fonts/truetype/"
          test "$(find "$share_dir/fonts/truetype" -maxdepth 1 -name 'Aptos*.ttf' -print | wc -l | tr -d ' ')" -ge 20
          # Rebuild the app archive so the fonts are inside it.
          archive="artifacts/LibreOffice-Draw-VSDX-macOS-${{ matrix.arch }}.zip"
          rm -f "$archive" "$archive.sha256"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$archive"
          shasum -a 256 "$archive" > "$archive.sha256"

      - name: Create per-component app bundles and the installer
        run: |
          set -euxo pipefail
          shopt -s nullglob
          apps=("$RUNNER_TEMP/mac-install/"*.app)
          test "${#apps[@]}" -eq 1
          app="${apps[0]}"
          base="$(basename "$app" .app)"

          # Stage the main app, the per-component wrapper apps and the
          # installer as siblings; the zip root is the stage directory.
          # The wrapper apps launch the main app that sits next to them.
          stage="$RUNNER_TEMP/macos-package"
          rm -rf "$stage"
          mkdir -p "$stage"
          ditto "$app" "$stage/$base.app"

          version="$(plutil -extract CFBundleShortVersionString raw "$app/Contents/Info.plist")"
          icon="$(find "$app/Contents/Resources" -maxdepth 1 -name 'main.icns' -print -quit)"

          make_component() {
            local name="$1" flag="$2" ident="$3"
            local bundle="$stage/LibreOffice${name}.app"
            mkdir -p "$bundle/Contents/MacOS" "$bundle/Contents/Resources"
            cat > "$bundle/Contents/MacOS/soffice" <<EOF
          #!/bin/sh
          # Launch $base $name using the full app that sits next to this bundle.
          here="\$(cd "\$(dirname "\$0")/../../.." && pwd)"
          main="\$here/$base.app/Contents/MacOS/soffice"
          [ -x "\$main" ] || main="/Applications/$base.app/Contents/MacOS/soffice"
          exec "\$main" $flag "\$@"
          EOF
            chmod a+x "$bundle/Contents/MacOS/soffice"
            cat > "$bundle/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key>
            <string>soffice</string>
            <key>CFBundleIdentifier</key>
            <string>$ident</string>
            <key>CFBundleName</key>
            <string>LibreOffice $name</string>
            <key>CFBundleDisplayName</key>
            <string>LibreOffice $name</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>$version</string>
            <key>CFBundleIconFile</key>
            <string>main</string>
          </dict>
          </plist>
          EOF
            if [ -n "$icon" ]; then
              cp "$icon" "$bundle/Contents/Resources/main.icns"
            fi
            codesign --force -s - "$bundle"
          }

          make_component Writer --writer org.libreoffice.dev.writer
          make_component Calc --calc org.libreoffice.dev.calc
          make_component Impress --impress org.libreoffice.dev.impress
          make_component Draw --draw org.libreoffice.dev.draw
          make_component Math --math org.libreoffice.dev.math
          make_component Base --base org.libreoffice.dev.base

          # A double-clickable installer app that copies the main app and
          # the per-component apps into /Applications.
          installer="$stage/Install LibreOffice Extras.app"
          mkdir -p "$installer/Contents/MacOS"
          cat > "$installer/Contents/MacOS/main" <<'EOS'
          #!/bin/sh
          set -e
          here="$(cd "$(dirname "$0")/../../.." && pwd)"
          for name in LibreOffice LibreOfficeWriter LibreOfficeCalc LibreOfficeImpress LibreOfficeDraw LibreOfficeMath LibreOfficeBase; do
            [ -d "$here/$name.app" ] || continue
            rm -rf "/Applications/$name.app"
            cp -R "$here/$name.app" /Applications/
            xattr -cr "/Applications/$name.app"
          done
          echo "Installed:"
          for name in LibreOffice LibreOfficeWriter LibreOfficeCalc LibreOfficeImpress LibreOfficeDraw LibreOfficeMath LibreOfficeBase; do
            [ -d "/Applications/$name.app" ] && echo "  $name"
          done
          exec "/Applications/LibreOffice.app/Contents/MacOS/soffice" --headless --version
          EOS
          chmod a+x "$installer/Contents/MacOS/main"
          cat > "$installer/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key>
            <string>main</string>
            <key>CFBundleIdentifier</key>
            <string>org.libreoffice.dev.installer</string>
            <key>CFBundleName</key>
            <string>Install LibreOffice Extras</string>
            <key>CFBundleDisplayName</key>
            <string>Install LibreOffice Extras</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0</string>
          </dict>
          </plist>
          EOF
          codesign --force -s - "$installer"

          # Sanity-check a wrapper with the real sibling layout.
          "$stage/LibreOfficeWriter.app/Contents/MacOS/soffice" --headless --version

          # Rebuild the archive with the main app, the component apps and
          # the installer as siblings at the zip root.
          archive="artifacts/LibreOffice-Draw-VSDX-macOS-${{ matrix.arch }}.zip"
          rm -f "$archive" "$archive.sha256"
          ditto -c -k --sequesterRsrc "$stage" "$archive"
          shasum -a 256 "$archive" > "$archive.sha256"

      - name: Upload the macOS app
        uses: actions/upload-artifact@v7
        with:
          name: LibreOffice-Draw-VSDX-macOS-${{ matrix.arch }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.arch }}-build-logs
          path: |
            autogen.log
            config.log
            fetch.log
            build.log
            regression-tests.log
            install.log
            workdir/CppunitTest/*.test.log
          if-no-files-found: ignore
          retention-days: 14
